    if(cols.length){h+='<div class="sectionhead"><h2>Maps as field notes</h2><p>Open a collection to explore every place, then copy the map into your own Flâneur.</p></div><section class="collections" aria-label="Public collections">';cols.forEach(function(c){var spots=Array.isArray(c.spots)?c.spots:[],n=spots.length,itin=spots.length&&typeof spots[0].d==="number";h+='<a class="collection" href="./c.html?s='+encodeURIComponent(c.slug)+'"><div class="colcopy"><div class="coltype">'+(itin?'Walking itinerary':'Curated collection')+'</div><div class="colname">'+(c.emoji?esc(c.emoji)+' ':'')+esc(c.name||'Untitled map')+'</div><div class="colmeta">'+n+' place'+(n===1?'':'s')+(c.city?' · '+esc(pretty(c.city)):'')+'</div><div class="colopen">Read the map <span aria-hidden="true">→</span></div></div><div class="atlas">'+mapSvg(spots,itin)+'</div></a>';});h+='</section>';}else{h+='<div class="sectionhead"><h2>Maps as field notes</h2></div><div class="panel empty">No public collections yet — this atlas is waiting for its first chapter.</div>';}
    h+='<section class="cta"><div><h2>Follow taste, not just friends.</h2><p>Open Flâneur to follow @'+esc(p.username)+' and copy the maps that make you want to wander.</p></div><a class="ctabtn" href="./#u='+encodeURIComponent(p.username)+'">Follow in Flâneur →</a></section>';
    app.innerHTML=h;
    var avimg=app.querySelector('img.avatar');if(avimg)avimg.onerror=function(){var d=document.createElement('div');d.className='avatar';d.textContent=init;avimg.replaceWith(d);};
    var sbt=document.getElementById('share-profile');if(sbt)sbt.onclick=function(){shareProfile(p);};
  }
  var u=uParam();if(!u){state("No profile specified.");return;}if(!window.supabase){state("Couldn’t load this atlas. Please try again.");return;}
  var sb=window.supabase.createClient(SB_URL,SB_ANON);
  sb.from("public_profiles").select("*").eq("username",u).maybeSingle().then(function(r){if(r.error||!r.data){state("No wanderer found at @"+u+".");return;}var p=r.data;Promise.all([sb.from("collections").select("slug,name,emoji,city,spots").eq("owner_id",p.user_id).order("updated_at",{ascending:false}),sb.from("follows").select("*",{count:"exact",head:true}).eq("followee_id",p.user_id),sb.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",p.user_id)]).then(function(a){render(p,(a[0]&&a[0].data)||[],{followers:(a[1]&&a[1].count)||0,following:(a[2]&&a[2].count)||0});},function(){render(p,[],{followers:0,following:0});});},function(){state("Couldn’t load this profile.");});
})();

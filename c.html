    h+='</section><aside class="panel side"><div class="sidetop"><div class="sectiontag">At a glance</div><h2>A map to keep, not just view.</h2><p>Open it in Flâneur to preserve the original and shape your own version.</p></div><div class="facts"><div class="fact"><b>'+spots.length+'</b><span>'+(itin?'Stops':'Places')+'</span></div><div class="fact"><b>'+esc(city)+'</b><span>Base</span></div><div class="fact"><b>'+distance+'</b><span>'+(itin?'Walking':'Distance')+'</span></div><div class="fact"><b>'+duration+'</b><span>Pace</span></div></div><a class="sidecopy" href="./#c='+encodeURIComponent(c.slug||"")+'">Copy this map →</a></aside></div>';
    h+='<section class="panel comments" id="cmts"><div class="commentshead"><div><div class="sectiontag">Field notes</div><h2>Comments</h2></div></div><div class="cmtempty">Loading the conversation…</div></section>';
    h+='<section class="bottomcta"><div><h2>Your city deserves a point of view.</h2><p>Collect the places you would send a friend, publish the map, and pass it on.</p></div><a class="bottomctabtn" href="./">Build a map in Flâneur →</a></section>';
    app.innerHTML=h;
    var sh=document.getElementById("share-map");if(sh)sh.onclick=function(){shareCollection(c);};renderComments(c.slug);renderAuthor(c.owner_id);
    try{sb.from("collection_likes").select("*",{count:"exact",head:true}).eq("slug",c.slug).then(function(lc){var n=(lc&&lc.count)||0,el=document.getElementById("likes");if(el)el.textContent=n?("♥ "+n+" save"+(n===1?"":"s")):"♡ Public map";},function(){});}catch(e){}
    if(window.L&&spots.length){try{var map=L.map("map",{scrollWheelZoom:false,attributionControl:true,zoomControl:true});L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",{maxZoom:19,subdomains:"abcd",attribution:'© OpenStreetMap, © CARTO'}).addTo(map);var bounds=[];if(itin&&spots.length>1)L.polyline(spots.map(function(s){return[Number(s.lat),Number(s.lng)];}),{color:"#315548",weight:4,opacity:.78,lineCap:"round",lineJoin:"round"}).addTo(map);spots.forEach(function(s,i){var mk=L.marker([Number(s.lat),Number(s.lng)],{icon:L.divIcon({html:'<div class="pin">'+(i+1)+'</div>',className:"",iconSize:[29,29],iconAnchor:[14.5,14.5]})});mk.addTo(map);bounds.push([Number(s.lat),Number(s.lng)]);});if(bounds.length===1)map.setView(bounds[0],14);else map.fitBounds(bounds,{padding:[45,45],maxZoom:15});setTimeout(function(){try{map.invalidateSize();}catch(e){}},120);}catch(e){var mf=document.getElementById("mapframe");if(mf)mf.style.display="none";}}
    else{var mf=document.getElementById("mapframe");if(mf)mf.style.display="none";}
    if(spots.length){var w0=spots[0],wq="latitude="+encodeURIComponent(w0.lat)+"&longitude="+encodeURIComponent(w0.lng);Promise.all([fetch("https://api.open-meteo.com/v1/forecast?"+wq+"&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),fetch("https://air-quality-api.open-meteo.com/v1/air-quality?"+wq+"&current=european_aqi").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})]).then(function(a){var j=a[0],aq=a[1],el=document.getElementById("wx");if(!el)return;if(!j||!j.current){el.textContent="Conditions unavailable";return;}var cu=j.current,parts=[wxEmoji(cu.weather_code)+" "+Math.round(cu.temperature_2m)+"°C"];
      if(cu.wind_speed_10m!=null)parts.push("wind "+Math.round(cu.wind_speed_10m)+" km/h");if(aq&&aq.current&&aq.current.european_aqi!=null)parts.push("air "+Math.round(aq.current.european_aqi)+aqiWord(aq.current.european_aqi));el.textContent=parts.join(" · ");}).catch(function(){var el=document.getElementById("wx");if(el)el.textContent="Conditions unavailable";});}
  }
  function renderAuthor(uid){if(!uid)return;try{sb.from("public_profiles").select("username,display_name,avatar_v,user_id").eq("user_id",uid).maybeSingle().then(function(r){if(!r||!r.data)return;var a=r.data,bx=document.getElementById("byline");if(!bx)return;var av=a.avatar_v?(SB_URL+"/storage/v1/object/public/avatars/"+encodeURIComponent(a.user_id)+"?v="+a.avatar_v):null,ic=av?('<img src="'+esc(av)+'" alt="">'):('<span class="byi">'+esc((a.display_name||a.username||"?").slice(0,1).toUpperCase())+'</span>');bx.innerHTML='<a class="byl" href="./u.html?u='+encodeURIComponent(a.username)+'">'+ic+'<span>Mapped by '+esc(a.display_name||("@"+a.username))+' · @'+esc(a.username)+'</span></a>';var im=bx.querySelector("img");if(im)im.onerror=function(){var sp=document.createElement("span");sp.className="byi";sp.textContent=(a.display_name||a.username||"?").slice(0,1).toUpperCase();im.replaceWith(sp);};},function(){});}catch(e){}
  }
  function renderComments(slug){try{sb.from("collection_comments").select("id,user_id,body,created_at").eq("slug",slug).order("created_at",{ascending:true}).limit(200).then(function(r){var rows=(r&&r.data)||[],box=document.getElementById("cmts");if(!box)return;if(!rows.length){box.innerHTML='<div class="commentshead"><div><div class="sectiontag">Field notes</div><h2>Comments</h2></div><span class="sectioncount">0 notes</span></div><div class="cmtempty">No comments yet. Open the map in Flâneur to leave the first field note.</div>';return;}var ids=rows.map(function(x){return x.user_id;});sb.from("public_profiles").select("user_id,username,display_name").in("user_id",ids).then(function(pr){var pm={};((pr&&pr.data)||[]).forEach(function(p){pm[p.user_id]=p;});var h='<div class="commentshead"><div><div class="sectiontag">Field notes</div><h2>Comments</h2></div><span class="sectioncount">'+rows.length+' note'+(rows.length===1?'':'s')+'</span></div>';rows.forEach(function(m){var a=pm[m.user_id];h+='<div class="cmt"><div class="cmtwho">'+esc(a?(a.display_name||('@'+a.username)):'A wanderer')+'</div><div class="cmtbody">'+esc(m.body)+'</div></div>';});box.innerHTML=h;},function(){});},function(){});}catch(e){}
  }
  var slug=slugParam();if(!slug){state("Nothing specified.");return;}if(!window.supabase){state("Couldn’t load this map. Please try again.");return;}var sb=window.supabase.createClient(SB_URL,SB_ANON);sb.from("collections").select("*").eq("slug",slug).maybeSingle().then(function(r){if(r.error||!r.data){state("This map couldn’t be found — it may have been made private.");return;}render(r.data);},function(){state("Couldn’t load this map.");});
})();

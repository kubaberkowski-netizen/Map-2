name: Native CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "tools/build-native.js"
      - "tools/patch-active-walk.js"
      - "src/app.template.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm run native:bundle
      - run: npx cap sync android
      - name: Compile and test Android
        working-directory: android
        run: ./gradlew test assembleDebug --stacktrace

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run native:bundle
      - run: npx cap sync ios
      - name: Compile iOS for Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/FlaneurDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

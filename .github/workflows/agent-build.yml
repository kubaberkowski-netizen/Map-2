name: Regenerate app bundle for native walk foundation

on:
  push:
    branches:
      - codex/native-walk-foundation

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-walk-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build web and native payloads
        run: npm run native:bundle

      - name: Generate native platform projects
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync

      - name: Normalize changed text files
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", "origin/main...HEAD"]
          ).split(b"\0")
          for raw in changed:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8", "surrogateescape"))
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              cleaned = re.sub(rb"[ \t]+(?=\r?\n)", b"", data)
              cleaned = re.sub(rb"[ \t]+\Z", b"", cleaned)
              if cleaned != data:
                  path.write_bytes(cleaned)
                  print(f"normalized {path}")
          PY
          git diff --check origin/main
          git diff --check

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh native app artifacts"
            git push origin HEAD:codex/native-walk-foundation
          fi

name: Regenerate app bundle for native walk foundation

on:
  push:
    branches:
      - codex/native-walk-foundation

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-walk-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build web and native payloads
        run: npm run native:bundle

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json index.html 'spots.*.js' 'fixtures.*.js'
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate app bundle"
            git push origin HEAD:codex/native-walk-foundation
          fi

name: Diagnose native foundation branch

on:
  push:
    branches:
      - codex/native-walk-foundation

permissions:
  contents: write

concurrency:
  group: native-foundation-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-walk-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize generated native text
        run: npm run native:normalize

      - name: Record remaining diff-check diagnostics
        run: |
          git diff --check origin/main > .native-foundation-diff-check.txt 2>&1 || true
          if [ ! -s .native-foundation-diff-check.txt ]; then
            printf 'clean\n' > .native-foundation-diff-check.txt
          fi
          cat .native-foundation-diff-check.txt

      - name: Commit normalized files and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: normalize native project text" || exit 0
          git push origin HEAD:codex/native-walk-foundation

name: Regenerate native foundation artifacts

on:
  push:
    branches:
      - codex/native-walk-foundation

permissions:
  contents: write

concurrency:
  group: native-foundation-regenerate
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-walk-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci

      - name: Rebuild web and native artifacts
        run: |
          npm run native:bundle
          npx cap sync
          npm run native:normalize
          git diff --check origin/main
          git diff --check

      - name: Commit deterministic artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate native foundation artifacts"
            git push origin HEAD:codex/native-walk-foundation
          fi

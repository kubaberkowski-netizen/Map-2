name: CI

# Production build gate. Rebuild from source, verify committed outputs are
# deterministic, parse the deployed bundles, and assert structural invariants.
# GitHub Pages still serves main as-is; this workflow never deploys.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build and verify generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile regression contracts
        run: npm run test:mobile

      - name: Check pull-request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD

      # build.js validates data, regenerates the deployable shell, catalogue
      # sidecars and SEO outputs, and runs its own syntax/structure checks.
      - name: Build (validate and regenerate)
        run: npm run build

      - name: Assemble and synchronize native projects
        run: |
          node tools/build-native.js
          npx cap sync
          npm run native:normalize

      # A clean tree proves every deterministic build output was committed.
      - name: Committed build is up to date
        run: |
          git diff --check
          DRIFT="$(git status --porcelain)"
          if [ -n "$DRIFT" ]; then
            echo "::error::npm run build or native sync changed the working tree. Commit every generated file and deleted content hash."
            echo "$DRIFT"
            git diff --stat
            exit 1
          fi

      - name: Parse deployed bundles
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const m=h.match(/<script>[\s\S]*?<\/script>/g)||[];const big=m.map(s=>s.slice(8,-9)).sort((a,b)=>b.length-a.length)[0]||"";fs.writeFileSync("/tmp/app.js",big);'
          node --check /tmp/app.js
          node --check spots.*.js

      # Read expected counts from build.js so CI cannot drift from the build's
      # canonical BASELINE when categories, Worlds, or catalogue data change.
      - name: Verify structural counts
        run: |
          EXPECTED=$(node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("build.js", "utf8");
          const match = source.match(/const BASELINE = \{ entries: ([0-9]+), worlds: ([0-9]+), categories: ([0-9]+) \};/);
          if (!match) {
            console.error("Could not read BASELINE from build.js");
            process.exit(1);
          }
          console.log(match.slice(1).join(" "));
          NODE
          )
          read -r EXPECTED_E EXPECTED_W EXPECTED_C <<< "$EXPECTED"

          W=$(grep -oE 'match:[[:space:]]*e[[:space:]]*=>' index.html | wc -l)
          C=$(grep -oE '[A-Za-z0-9_]+:\{l:"' index.html | wc -l)
          E=$(grep -oE 'id:"[^"]*",n:"' spots.*.js | wc -l)
          S=$(grep -oE 'id:"[^"]*",n:"' index.html | wc -l)

          echo "worlds=$W/$EXPECTED_W categories=$C/$EXPECTED_C entries=$E/$EXPECTED_E shell_entries=$S"
          [ "$W" = "$EXPECTED_W" ] || { echo "::error::Worlds count $W != $EXPECTED_W"; exit 1; }
          [ "$C" = "$EXPECTED_C" ] || { echo "::error::categories $C != $EXPECTED_C"; exit 1; }
          [ "$E" = "$EXPECTED_E" ] || { echo "::error::entries $E != $EXPECTED_E"; exit 1; }
          [ "$S" = "0" ] || { echo "::error::catalogue leaked into the shell ($S inline entries)"; exit 1; }
